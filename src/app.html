<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#000" />
		<meta name="description" content="Hidden words. Secret colors. Every peek risks a move." />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico?v=2" />
		<!-- Windows tiles -->
		<meta name="msapplication-config" content="%sveltekit.assets%/browserconfig.xml" />
		<meta name="msapplication-TileColor" content="#000" />
		<meta name="msapplication-TileImage" content="%sveltekit.assets%/windows/Square150x150Logo.scale-100.png" />
		<meta name="mobile-web-app-capable" content="yes" />
		<!-- iOS PWA Support -->
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Trade Secrets" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/ios/180.png?v=2" />
		<title>Trade Secrets</title>
		%sveltekit.head%
		<script>
			if ('serviceWorker' in navigator) {
				navigator.serviceWorker.register('./service-worker.js', { type: 'module' });
			}
		</script>
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
